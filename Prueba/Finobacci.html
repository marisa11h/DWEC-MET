<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            function fona(f1) {
                if (f1 === 0 || f1 === 1) {
                    return f1;
                }else {
                    return fona(f1 - 1) + fona(f1 - 2);
                }

                
            }
            document.write(fona(10));
            fona(10);
    </script>

    

</body>
