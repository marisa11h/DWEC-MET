<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
    document.write(`<p>La operación 20 == 20 es ${20 == 20} </p>`)
    document.write(`<p>La operación 20 === 20 es ${20 === 20}</p>`)
    document.write(`<p>La operación 20 === 20.0 es ${20 === 20.0}</p>`)
    document.write(`<p>La operación "Juan" == "juan" es ${"Juan" == "juan"}</p>`)
    document.write(`<p>La operación "Juan" > "juan" es ${"Juan" > "juan"}</p>`)
    document.write(`<p>La operación "Juan" < "juan" es ${"Juan" < "juan"}</p>`)
    document.write(`<p>La operación "123" == 123 es ${"123" == 123}</p>`)
    document.write(`<p>La operación "123" === 123 es ${"123" === 123}</p>`)
    document.write(`<p>La operación parseInt("123") ==== 123 es ${parseInt("123") === 123}</p>`)
    </script>
</body>
</html>
