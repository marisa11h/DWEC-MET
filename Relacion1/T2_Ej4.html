<script>

for (let index = 9; index <= 21; index++) {
    let esHoraPunto = true;
    for (let j = 0; j < 2; j++) {
        if (esHoraPunto) {
            document.write(index + ":00<br>");
        } else {
            document.write(index + ":30<br>");
        }
        
        esHoraPunto = !esHoraPunto;
    }


}    
    </script>
