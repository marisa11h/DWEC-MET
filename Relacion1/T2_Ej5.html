<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        var countdown = prompt("Introduce un número para iniciar la cuenta atrás");
        while (countdown>0) {
            alert(countdown+ "... " );
            countdown--;
            /*Lo que ocurre cuando pones ++ es que el programa entra en un bucle infinito donde el contador
             va sumando siempre un numero más y no va a parar nunca*/
        }
    </script>
</body>
</html>
