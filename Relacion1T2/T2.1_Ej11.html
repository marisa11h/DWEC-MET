<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio11</title>
</head>
<body>
    <script>
        /*Realiza un programa que pida una cadena de texto y la devuelva al revés. Es decir, si la frase es “hola que
          tal” deberá mostrar “lat euq aloh”.*/
          let frase = prompt("Dime una frase: ");
          let frasealreves = "";
          for (let index = frase.length -1; index >= 0; index--) {
                frasealreves += frase[index];            
          }

          document.write(`La frase "${frase}" al reves es ${frasealreves}`);

    </script>
</body>
</html>
