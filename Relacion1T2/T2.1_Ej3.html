<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <script>
        /*Crea un programa que muestre la hora actual en los formatos siguientes:
        1. 14:35:07 (hora detallada con minutos y segundos)
        2. Son las 14h y 35m
        */

        let horas = new Date().getHours();
        let minutos = new Date().getMinutes();
        let segundos = new Date().getSeconds();

        document.write(`La hora es ${horas}:${minutos}:${segundos}<br>`);
        document.write(`Son las ${horas}h y ${minutos}m`);
    </script>
</body>
</html>
