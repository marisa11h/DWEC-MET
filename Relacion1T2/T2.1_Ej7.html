<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio7</title>
</head>
<body>
    <script>
        /*Escribe un programa que pida tres números y escriba en la pantalla cuál es el mayor. */
        let num1 = parseInt(prompt("Dime un primer número:"));
        let num2 = parseInt(prompt("Dime un segundo número: "));
        let num3 = parseInt(prompt("Dime un tercer número: "));

        let max = Math.max(num1, num2, num3);
        document.write(`El número más alto entre los números ${num1}, ${num2} y ${num3} es ${max}`);
    </script>
</body>
</html>
