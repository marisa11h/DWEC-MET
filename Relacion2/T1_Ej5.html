<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        let numeroCorrecto = parseInt(prompt("Introduzca el número a adivinar: "));
        let numeroDado;
        let mensaje = "Introduzca un número para adivinar el escondido:";

        do {
            numeroDado = parseInt(prompt(mensaje));
            if (numeroDado != numeroCorrecto) {
                if (numeroDado > numeroCorrecto) {
                    mensaje = "El número es menor que el que me has dado intentalo de nuevo"
                } else {
                    mensaje = "El número es mayor que el que me has dado intentalo de nuevo"
                }
            }
        } while (numeroDado != numeroCorrecto);
    </script>
</body>
</html>
