<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        function suma(...args){
            let total = 0
            for (let index = 0; index < args.length; index++) {
                total += args[index];

        }
         document.write(`La suma de todos los numeros es ${total}`);
    }

        suma(5, 10, 7, 6, 9, 32);

    </script>
</body>
</html>
