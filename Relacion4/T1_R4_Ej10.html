<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>
<body>
    <script>
        let base = parseInt(prompt("Dime la base del rectangulo"));
        let altura = parseInt(prompt("Dime la altura del rectangulo"));

        function areaRectangulo(base, altura) {
            let area = base * altura;
            document.write(`El área de este rectangulo que se obtiene al multuplicar sus dos lados es ${area}`);
        }

        areaRectangulo(base, altura);
    </script>
</body>
</html>
