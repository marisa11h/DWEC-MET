<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
        <script>
            function contarLosArgumentos(...args) {
                let total = 0
                for (let index = 0; index < args.length; index++) {
                    total++;
                    
            }
            document.write(`El numero de argumentos es ${total}`)
        }

        contarLosArgumentos(1, 5, "hola", 10, 20, "yodo");
        </script>
</body>
</html>
