<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        function sumaTodosLosOtros(...args) {
            total = 0;
            for (let index = 0; index < args.length; index++) {
                if (index % 2 !== 0) {
                    total += args[index];
                }
            }
            document.write(`Sumamos los numeros alternativamente y nos da el resultado de ${total}`)
        }

        sumaTodosLosOtros(5, 6, 10, 1, 3, 1, 10, 1);
    </script>
</body>
</html>
