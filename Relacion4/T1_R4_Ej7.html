<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    <script>
        let dividendo = parseFloat(prompt("Dime el dividendo: "));
        let divisor = parseFloat(prompt("Dime el divisor: "));

        function divisibleEntre(dividendo, divisor) {
            if (dividendo % divisor === 0) {
                document.write(`El número ${dividendo} es divisible por ${divisor}`);
            } else{
                document.write(`El número ${dividendo} no es divisible por ${divisor}`)
            }
        }

        divisibleEntre(dividendo, divisor);
    </script>
</body>
</html>
