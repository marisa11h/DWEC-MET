<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>

        function solounicos(...args) {
            const array3 = [];

            for (let index = 0; index < args.length; index++) {
                let repetido = false;
                for (let j = 0; j < array3.length; j++) {
                    if (args[index] === array3[j]) {
                         repetido = true;    
                    }
                }

                if (!repetido) {
                    array3.push(args[index]);
                } 
            }   
            document.write(`la lista terminada es ${array3}`);     
        }

        solounicos("hola", 10, "hola", 2, 10, "Todo", "Todo");

    </script>
</body>
</html>
