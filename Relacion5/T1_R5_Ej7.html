<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    <script>
        function cuadradosysuma(...args) {
            let total = 0;
            for (let index = 0; index < args.length; index++) {
                total += args[index] * args[index];
            }
            document.write(`A ver la lista con sus cuadrados y suma es ${total}`);
        }

        cuadradosysuma(5, 7, 9, 2, 9);
    </script>
</body>
</html>
