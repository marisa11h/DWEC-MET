<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
</head>
<body>
    <input type="button" value="abrirVentana" onclick="abrirVentana()">
    <script>
        let vent;
        
        function abrirVentana() {
            vent = window.open("", "", `width=500,height=400`);
            vent.document.write(`
                <input type="button" value="CerrarVentana" onclick="cerrarVentana()"> 
                <script>
                    function cerrarVentana() {
                        window.close();
                    }
                <\/script>
            `);
        }
        
    </script>
</body>
</html>
