<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <p onclick="abrirVentanas()">Haz click aquí</p>
    <script>
        function abrirVentanas() {
            for (let index = 1; index <= 5; index++) {
                let vent = window.open("", "_blank", `width=350, height=350`);

                vent.document.write(
                    `ventana ${index}
                    <button onclick="window.close()">cerrar</button>`
                );
                
            }
                }
    </script>
</body>
</html>
