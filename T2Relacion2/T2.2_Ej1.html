<body>
    <script>
        let segundos = 60;
        let cronometro = setInterval(function() {
            segundos = segundos - 1;
            console.log(segundos);
        }, 1000);

       setTimeout(function() {
        clearInterval(cronometro)
        console.log(`${segundos}`);
       }, 60000);
    </script>
