<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2</title>
</head>
<body>
    <script>
        let angulo = parseInt(prompt("Dime un ángulo: "));

        let seno = Math.sin(angulo);
        let coseno = Math.cos(angulo);
        let tangente = Math.tan(angulo);

        document.write(`El ángulo ${angulo}° tiene un seno de ${seno}, un coseno de ${coseno} y una tangente de ${tangente}.`);

    </script>
</body>
</html>
