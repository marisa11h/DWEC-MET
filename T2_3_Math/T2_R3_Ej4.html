<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio4</title>
</head>
<body>
    <script>
        /*4. Mejora el ejercicio anterior para que continue realizando el mismo cálculo
        hasta que el usuario decida que no quiere continuar.*/
        let menu = "";
        while (menu != "1") {
            let cateto1 = parseInt(prompt("Dime cuanto es el cateto1: "));
            let cateto2 = parseInt(prompt("Dime cuanto es el cateto2: "));
            let hipotenusa = Math.sqrt(Math.pow(cateto1, 2) + Math.pow(cateto2, 2));
            
            alert(`La hipotenusa de este triangulo rectangulo es ${hipotenusa}`);

            menu = prompt("Cuando quieras parar de calcular hipotenusas de triangulos tienes está opción: 1.-Salir");
        }

         document.write(`"Se termino el cálculo de las hipotenusas"`);
       

    </script>
</body>
</html>
