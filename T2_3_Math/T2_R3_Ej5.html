<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio5</title>
</head>
<body>
    <script>
            /*5.-Crea una web para resolver ecuaciones de segundo grado. Deber pedir por á
            tanto los coeficientes y mostrar las soluciones posibles.
            • \(a\) es el coeficiente cuadrático: Nunca puede ser cero.
            • \(b\) es el coeficiente lineal: .
            • \(c\) es el término independiente: */

            let a = parseInt(prompt("Dime el coeficiente cuadrático: "));
            let b = parseInt(prompt("Dime el coeficiente lineal: "));
            let c = parseInt(prompt("Dime el término independiente: "));

            let esgparte1 = Math.sqrt(Math.pow(b, 2) - 4 * a * c);
            let esgresultadopos = (-b + esgparte1) / (2 * a);
            let esgresultadoneg = (-b - esgparte1) / (2 * a);

            if (a === 0) {
                document.write("Nunca puede dar cero, no válido");
            } if (esgparte1 <= 0) {
                document.write("No se puede hacer la raiz de un numero negativo");
            } else{
                document.write(`La ecuación de segundo grado da como resultados los siguientes: <br> En positivo tenemos el resultado de ${esgresultadopos} y en negativo tenemos el resultado de ${esgresultadoneg}`);
            }

           
            
    </script>
</body>
</html>
