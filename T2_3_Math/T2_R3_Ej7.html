<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Senos</title>
    <style>
        /* Estilos básicos para que se vea como una tabla real */
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<script>
    document.write("<table>");
    document.write("<tr><th>Número</th><th>Seno</th></tr>");

    for (var i = 1; i <= 10; i++) {
        document.write("<tr>");
        document.write("<td>" + i + "</td>");
        // Math.sin(i) calcula el seno del número en radianes
        document.write("<td>" + Math.sin(i).toFixed(2) + "</td>");
        document.write("</tr>");
    }

    document.write("</table>");
</script>

</body>
</html>
