<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
</head>
<body>
    <script>
        let max = 200;
        let min = 100;
        let random0y1 = Math.random();
        let random100y200 = Math.random() * (max - min + 1) + min;
        document.write(`El numero aleatorio entre 1 y 0 es ${random0y1}<br>`);
        document.write(`El numero aleatorio entre 200 y 100 es ${random100y200}<br>`);
        /* (max - min + 1) + min explicacion:
        max = numero más alto entre los números que quieres que este el número aleatorio.
        min = numero más pequeño entre los números que quieres que este el número aleatorio.
        - = este simbolo entre medias de los dos es el que dice que el número aleatorio está entre los números max y 
        min.
        + 1 = Esto es para que se incluya el número 200 ya que si no lo pones solo te contaria entre 100 y 199.
        + min = Le estás diciendo que empiece desde el número min.
        */
        let num = parseInt(prompt("Dime un número: "));
        let num2 = parseInt(prompt("Dime otro número: "));

        let random2 = Math.random() * (num - num2 +1) + min;
        document.write(`El numero aleatorio entre ${num} y ${num2} es ${random2}`);
    </script>
</body>
</html>
