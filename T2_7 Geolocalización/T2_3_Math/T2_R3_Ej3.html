<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <script>
        let cateto1 = parseInt(prompt("Dime cuanto es el cateto1: "));
        let cateto2 = parseInt(prompt("Dime cuanto es el cateto2: "));
        let hipotenusa = Math.sqrt(Math.pow(cateto1, 2) + Math.pow(cateto2, 2));

        document.write(`La hipotenusa de este triangulo rectangulo es ${hipotenusa}`);
    </script>
</body>
</html>
