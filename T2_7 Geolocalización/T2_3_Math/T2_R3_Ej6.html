<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio6</title>
</head>
<body>
    <script>
            /*6.-Crea una web que calcule potencias*/

            let num = parseInt(prompt("Dime un número: "));
            let potencia = parseInt(prompt("Dime el número de la potencia que quieres calcular sobre este número: "));

            let potencias = Math.pow(num,potencia);

            document.write(`El número ${num} si le das el exponente ${potencia} te dara el resultado de su potencia = ${potencias}`);
    </script>
</body>
</html>
