<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio8</title>
</head>
<body>
    
    <script>
        let ima1 = `<img src="Imagen1.jpg" alt="Pinguino">`;
        let ima2 = `<img src="Imagen2.jpg" alt="agua">`;
        let ima3 = `<img src="Imagen3.jpg" alt="Mari">`;

        let random = Math.floor(Math.random() * 3) + 1;

        if (random === 1) {
            document.write(ima1);
        } else if (random === 2) {
            document.write(ima2);
        } else {
            document.write(ima3);
        }
        
        /*8. Crea una web en la que cada vez que se accede se muestre una imagen
        (de modo aleatorio) de entre 3 posibles.*/
            
    </script>
</body>
</html>
