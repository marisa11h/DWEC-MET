<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2</title>
</head>
<body>
    <script>
        let colores = ["azul", "amarillo", "rojo", "verde", "café", "rosa"];

        let color = prompt("Dime un color: ");

       
            if (colores.includes(color)) {
                document.write(`El color que has puesto que es ${color} es igual que uno de los colores que hay dentro del array colores`);
            } else{
                document.write(`El color que has puesto que es ${color} no es igual que uno de los colores que hay dentro del array colores`);
            }
            
   
    </script>
</body>
</html>
