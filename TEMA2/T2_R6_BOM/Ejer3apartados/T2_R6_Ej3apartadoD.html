<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3 - apartado D</title>
</head>
<body>

    <a href="#" onclick="abrirVentana(); return false;">Abrir ventana secundaria</a><br><br>
    <a href="#" onclick="cerrarVentanaActual(); return false;">Cerrar ventana actual</a><br><br>
    <a href="#" onclick="cerrarVentanaNueva(); return false;">Cerrar ventana secundaria (ventanaNueva)</a>

    <script>
        let ventanaNueva;

        function abrirVentana() {
            ventanaNueva = window.open("", "", "width=350,height=350");
        }

        function cerrarVentanaActual() {
            window.close();
        }

        function cerrarVentanaNueva() {
            if (ventanaNueva) {
                ventanaNueva.close();
            }
        }
    </script>
</body>
</html>
