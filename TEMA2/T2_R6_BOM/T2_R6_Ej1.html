<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
</head>
<body>
    <script>
        /*1.Muestra, maquetada en una tabla HTML toda la informaci n que puedas extraer
        mediante JavaScript del navegador cliente.
        */
        document.write("<table border=`1`>");
        document.write("<tr><th>propiedades</th><th>información</th></tr>");
        document.write("<tr><td><strong>Navegador</strong></td><td>" + navigator.userAgent + "</td></tr>");
        document.write("<tr><td><strong>Idioma del Sistema</strong></td><td>" + navigator.language + "</td></tr>");
        document.write("<tr><td><strong>¿Conexión en Línea?</strong></td><td>" + (navigator.onLine ? "Sí" : "No") + "</td></tr>");
        document.write("<tr><td><strong>¿Cookies Permitidas?</strong></td><td>" + (navigator.cookieEnabled ? "Sí" : "No") + "</td></tr>");
        document.write("<tr><td><strong>Plataforma</strong></td><td>" + navigator.platform + "</td></tr>");
        document.write("<tr><td><strong>Núcleos del Procesador (CPU)</strong></td><td>" + navigator.hardwareConcurrency + "</td></tr>");
        document.write("<tr><td><strong>Modo No Rastrear (doNotTrack)</strong></td><td>" + (navigator.doNotTrack || "No configurado") + "</td></tr>");
        document.write("</table>");
    </script>
</body>
</html>
