<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <script src="Funciones.js"></script>
    <script>
        let contador1 = 0;
        let contador2 = 0;
        let contador3 = 0;
        let contador4 = 0;
        let contador5 = 0;
        let contador6 = 0;

        for (let index = 0; index < 6000; index++) {
            switch (lanzamiento()) {
                case 1:
                    contador1 ++;
                    break;
                
                case 2:
                    contador2 ++;
                    break;
                
                case 3:
                    contador3 ++;
                    break;
                
                case 4:
                    contador4 ++;
                    break;
                
                case 5:
                    contador5 ++;
                    break;
                
                case 6:
                    contador6 ++;
                    break;
                
            }
        }

        document.write(`Ha salido:<br> Número 1: ${contador1} veces<br> Número 2: ${contador2} veces<br> Número 3: ${contador3} veces<br> Número 4: ${contador4} veces<br> Número 5: ${contador5} veces<br> Número 6: ${contador6} veces`)

        lanzamiento();

    </script>
</body>
</html>
