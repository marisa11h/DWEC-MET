    <script>
       let numeros = [1, 3, 4, 24, 58];
       let num2 = [6, 7, 8, 102, 39];

       let zipped = numeros.map((numeros, index) => [numeros, num2[index]]);

       let ordenar = zipped.sort((numeros, num2) => numeros - num2);

       console.log(zipped);
       console.log(ordenar);
    </script>
